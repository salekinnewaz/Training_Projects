services:
  mysql:
    image: mysql:8
    container_name: helpdesk-lite-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root_pwd_change_me
      MYSQL_DATABASE: helpdesk_lite
      MYSQL_USER: helpdesk
      MYSQL_PASSWORD: helpdesk_pwd
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      # D9: bootstrap the integration-test database (`helpdesk_lite_test`)
      # and grant the dev `helpdesk` user access to it. Runs once on
      # first container start (or after `docker compose down -v`).
      - ./docker/mysql-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "helpdesk", "-phelpdesk_pwd"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci

volumes:
  mysql_data:
    name: helpdesk-lite-mysql-data
