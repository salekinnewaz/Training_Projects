services:
  postgres:
    image: postgres:16-alpine
    container_name: helpdesk-lite-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: helpdesk_lite
      POSTGRES_USER: helpdesk
      POSTGRES_PASSWORD: helpdesk_pwd
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # D9: bootstrap the integration-test database
      # (`helpdesk_lite_test`) and grant the dev `helpdesk` user
      # access to it. Runs once on first container start (or after
      # `docker compose down -v`).
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U helpdesk -d helpdesk_lite"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres_data:
    name: helpdesk-lite-postgres-data