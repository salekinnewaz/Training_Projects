<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <!-- Page background -->
  <rect x="0" y="0" width="1440" height="900" fill="#f8f9fa"/>

  <!--
    Admin Dashboard — Dashboard tab active (canonical frame).
    Layout:
      App-header chrome strip: y=0..64.
      Heading "Dashboard" at x=40, y=108, 24px semibold.
      Tab switcher (right, x=1000..1160):
        "Dashboard" tab: x=1000..1085, ACTIVE (semibold #212529 + 2px underline at y=124).
        "Users" tab: x=1100..1160, INACTIVE (#868e96, no underline).
      Status summary cards: y=144..864 (4 cards, 320px wide, 16px gap, outer x=56..1384).
        Open: x=56..376.    In Progress: x=392..712.
        Resolved: x=728..1048.  Closed: x=1064..1384.
      Each card:
        Top zone y=156..200: status badge pill (left) + count (right, 28px semibold).
        Body y=200..840: 14 rows, 40px stride. Row = mono# + title + timestamp.
        Footer y=848..864 (only if applicable).
      Closed card: count muted #868e96, rows muted (no click).
  -->

  <!-- ===== App-header chrome strip ===== -->
  <g id="app-header">
    <rect x="0" y="0" width="1440" height="64" fill="#ffffff"/>
    <line x1="0" y1="64" x2="1440" y2="64" stroke="#dee2e6" stroke-width="1"/>
    <rect x="32" y="12" width="40" height="40" rx="6" fill="#212529"/>
    <text x="84" y="40" font-size="22" font-weight="600" fill="#212529">HelpDesk Lite</text>
    <text x="1280" y="40" font-size="14" fill="#495057">My Profile</text>
    <polyline points="1372,34 1380,42 1388,34" fill="none" stroke="#495057" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- ===== Heading row + tab switcher ===== -->
  <text x="40" y="108" font-size="24" font-weight="600" fill="#212529">Dashboard</text>

  <g id="tab-switcher">
    <!-- Dashboard tab (active) -->
    <text x="1000" y="113" font-size="14" font-weight="600" fill="#212529">Dashboard</text>
    <line x1="1000" y1="124" x2="1085" y2="124" stroke="#212529" stroke-width="2"/>
    <!-- Users tab (inactive) -->
    <text x="1100" y="113" font-size="14" fill="#868e96">Users</text>
  </g>

  <!-- =========================================================== -->
  <!-- ===== Open card (x=56..376) ===== -->
  <!-- =========================================================== -->
