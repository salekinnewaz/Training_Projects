    <!-- Top zone: badge + count -->
    <rect x="68" y="156" width="60" height="22" rx="11" fill="#fff5d6"/>
    <text x="98" y="171" font-size="11" font-weight="600" fill="#7a5c00" text-anchor="middle">Open</text>
    <text x="358" y="178" font-size="28" font-weight="600" fill="#212529" text-anchor="end">12</text>
    <!-- Divider -->
    <line x1="68" y1="196" x2="364" y2="196" stroke="#dee2e6" stroke-width="1"/>
    <!-- Body: 12 rows (showing 12, count says 12 so no footer) -->
    <g id="open-rows" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
      <!-- Row 1 -->
      <rect x="68" y="204" width="296" height="40" fill="#ffffff"/>
      <text x="76" y="228" font-size="11" fill="#868e96">#HD-47</text>
      <text x="124" y="228" font-size="13" fill="#212529">VPN keeps dropping</text>
      <text x="356" y="228" font-size="11" fill="#868e96" text-anchor="end">2h ago</text>
      <line x1="68" y1="244" x2="364" y2="244" stroke="#f1f3f5" stroke-width="1"/>

      <text x="76" y="268" font-size="11" fill="#868e96">#HD-45</text>
      <text x="124" y="268" font-size="13" fill="#212529">Cannot access shared drive</text>
      <text x="356" y="268" font-size="11" fill="#868e96" text-anchor="end">3h ago</text>
      <line x1="68" y1="284" x2="364" y2="284" stroke="#f1f3f5" stroke-width="1"/>

      <text x="76" y="308" font-size="11" fill="#868e96">#HD-43</text>
      <text x="124" y="308" font-size="13" fill="#212529">Expense report missing</text>
      <text x="356" y="308" font-size="11" fill="#868e96" text-anchor="end">5h ago</text>
      <line x1="68" y1="324" x2="364" y2="324" stroke="#f1f3f5" stroke-width="1"/>

      <text x="76" y="348" font-size="11" fill="#868e96">#HD-42</text>
      <text x="124" y="348" font-size="13" fill="#212529">Slack notifications off</text>
      <text x="356" y="348" font-size="11" fill="#868e96" text-anchor="end">6h ago</text>
      <line x1="68" y1="364" x2="364" y2="364" stroke="#f1f3f5" stroke-width="1"/>

      <text x="76" y="388" font-size="11" fill="#868e96">#HD-41</text>
      <text x="124" y="388" font-size="13" fill="#212529">New hire paperwork</text>
      <text x="356" y="388" font-size="11" fill="#868e96" text-anchor="end">1d ago</text>
      <line x1="68" y1="404" x2="364" y2="404" stroke="#f1f3f5" stroke-width="1"/>

      <text x="76" y="428" font-size="11" fill="#868e96">#HD-40</text>
      <text x="124" y="428" font-size="13" fill="#212529">Conf room display</text>
      <text x="356" y="428" font-size="11" fill="#868e96" text-anchor="end">1d ago</text>
      <line x1="68" y1="444" x2="364" y2="444" stroke="#f1f3f5" stroke-width="1"/>

      <text x="76" y="468" font-size="11" fill="#868e96">#HD-38</text>
      <text x="124" y="468" font-size="13" fill="#212529">Adobe license expired</text>
      <text x="356" y="468" font-size="11" fill="#868e96" text-anchor="end">2d ago</text>
      <line x1="68" y1="484" x2="364" y2="484" stroke="#f1f3f5" stroke-width="1"/>

      <text x="76" y="508" font-size="11" fill="#868e96">#HD-36</text>
      <text x="124" y="508" font-size="13" fill="#212529">Printer offline 2nd fl</text>
      <text x="356" y="508" font-size="11" fill="#868e96" text-anchor="end">2d ago</text>
      <line x1="68" y1="524" x2="364" y2="524" stroke="#f1f3f5" stroke-width="1"/>

