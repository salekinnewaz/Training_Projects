<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>HelpDesk Lite</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
    rel="stylesheet"
  />
  <!-- The admin dashboard's design calls for a geometric sans; the
       reference's letterforms (a spur-less "G" with a horizontal
       bar, a circular "o", straight-stem "m", single-storey "g")
       identify it as Figtree. It is scoped to the admin pages so the
       employee and agent dashboards keep the Inter face. -->
  <link
    href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  />
  <!-- The admin dashboard's stat-strip VALUES are set in a condensed
       grotesque. Measured off the reference PNG the value "156" has a
       37x19px ink box (per-glyph widths 7, 11 and 12px) and the trace
       shows a "1" that is a bare stem with no foot serif, a "5" with a
       flat top bar over a left stem and a "6" with a round bowl —
       letterforms Roboto Condensed reproduces exactly and no
       normal-width grotesque can. It is scoped to the admin pages so
       the employee and agent dashboards keep the Inter face. -->
  <link
    href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@600;700&display=swap"
    rel="stylesheet"
  />
</head>
<body>
  <app-root></app-root>
</body>
</html>
