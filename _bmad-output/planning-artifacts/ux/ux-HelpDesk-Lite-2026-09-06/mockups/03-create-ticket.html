<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>HelpDesk Lite — Create Ticket</title>
<style>
  :root {
    --surface-base: #FFFFFF;
    --surface-subtle: #F7F8FA;
    --border-default: #E4E7EB;
    --border-strong: #CBD2D9;
    --text-primary: #1F2933;
    --text-secondary: #52606D;
    --text-muted: #7B8794;
    --action-primary: #2563EB;
    --action-primary-hover: #1D4ED8;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Inter", system-ui, -apple-system, sans-serif;
    background: rgba(31, 41, 51, 0.32);
    color: var(--text-primary);
    font-size: 14px;
    line-height: 1.5;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px;
  }
  .modal {
    background: var(--surface-base);
    border-radius: 8px;
    box-shadow: 0 12px 32px rgba(31, 41, 51, 0.16);
    width: 100%;
    max-width: 480px;
    overflow: hidden;
  }
  .modal-header {
    padding: 24px 24px 16px;
    border-bottom: 1px solid var(--border-default);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .modal-title {
    font-size: 18px;
    font-weight: 600;
    color: var(--text-primary);
  }
  .close-btn {
    background: none;
    border: none;
    font-size: 18px;
    color: var(--text-muted);
    cursor: pointer;
    padding: 4px 8px;
  }
  form { padding: 24px; }
  .form-group { margin-bottom: 16px; }
  label {
    display: block;
    font-size: 14px;
    font-weight: 500;
    color: var(--text-secondary);
    margin-bottom: 6px;
  }
  .required { color: var(--action-primary); }
  input[type="text"],
  textarea,
  select {
    width: 100%;
    padding: 8px 12px;
    border: 1px solid var(--border-default);
    border-radius: 6px;
    font-size: 14px;
    font-family: inherit;
    color: var(--text-primary);
    background: var(--surface-base);
  }
  input:focus, textarea:focus, select:focus {
    outline: none;
    border-color: var(--border-strong);
    box-shadow: 0 0 0 2px var(--action-primary);
  }
  textarea {
    min-height: 100px;
    resize: vertical;
    font-family: inherit;
  }
  .helper {
    font-size: 12px;
    color: var(--text-muted);
    margin-top: 4px;
  }
  .form-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
  }
  .actions {
    display: flex;
    justify-content: flex-end;
    gap: 8px;
    margin-top: 24px;
    padding-top: 16px;
    border-top: 1px solid var(--border-default);
  }
  button {
    padding: 8px 16px;
    border-radius: 6px;
    font-size: 14px;
    font-weight: 500;
    font-family: inherit;
    cursor: pointer;
    border: 1px solid transparent;
  }
  .btn-secondary {
    background: var(--surface-base);
    border-color: var(--border-strong);
    color: var(--text-primary);
  }
  .btn-primary {
    background: var(--action-primary);
    color: white;
    border-color: var(--action-primary);
  }
  .btn-primary:hover { background: var(--action-primary-hover); border-color: var(--action-primary-hover); }
</style>
</head>
<body>
  <div class="modal" role="dialog" aria-labelledby="modal-title">
    <div class="modal-header">
      <div class="modal-title" id="modal-title">Create Ticket</div>
      <button class="close-btn" aria-label="Close">×</button>
    </div>
    <form>
      <div class="form-group">
        <label for="title">Title <span class="required">*</span></label>
        <input type="text" id="title" placeholder="Briefly describe the issue">
      </div>
      <div class="form-group">
        <label for="description">Description <span class="required">*</span></label>
        <textarea id="description" placeholder="What happened? When did it start? Any error messages?"></textarea>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label for="category">Category</label>
          <select id="category">
            <option value="">Select a category</option>
            <option>IT</option>
            <option>HR</option>
            <option>Finance</option>
            <option>General</option>
          </select>
          <div class="helper">Optional — helps agents route your ticket</div>
        </div>
        <div class="form-group">
          <label for="priority">Priority <span class="required">*</span></label>
          <select id="priority">
            <option>Low</option>
            <option selected>Medium</option>
            <option>High</option>
          </select>
        </div>
      </div>
      <div class="actions">
        <button type="button" class="btn-secondary">Cancel</button>
        <button type="submit" class="btn-primary">Create Ticket</button>
      </div>
    </form>
  </div>
</body>
</html>
