<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>HelpDesk Lite — Login</title>
<style>
  :root {
    --surface-base: #FFFFFF;
    --surface-subtle: #F7F8FA;
    --surface-muted: #EEF1F4;
    --border-default: #E4E7EB;
    --border-strong: #CBD2D9;
    --text-primary: #1F2933;
    --text-secondary: #52606D;
    --text-muted: #7B8794;
    --action-primary: #2563EB;
    --action-primary-hover: #1D4ED8;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Inter", system-ui, -apple-system, sans-serif;
    background: var(--surface-subtle);
    color: var(--text-primary);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px;
  }
  .login-card {
    background: var(--surface-base);
    border: 1px solid var(--border-default);
    border-radius: 8px;
    box-shadow: 0 4px 12px rgba(31, 41, 51, 0.08);
    padding: 48px 40px;
    width: 100%;
    max-width: 400px;
  }
  .brand {
    text-align: center;
    margin-bottom: 32px;
  }
  .brand-mark {
    width: 40px;
    height: 40px;
    background: var(--action-primary);
    border-radius: 6px;
    margin: 0 auto 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
    font-weight: 700;
    font-size: 18px;
  }
  .brand-name {
    font-size: 20px;
    font-weight: 600;
    color: var(--text-primary);
  }
  h1 {
    font-size: 20px;
    font-weight: 600;
    text-align: center;
    margin-bottom: 24px;
    color: var(--text-primary);
  }
  .form-group {
    margin-bottom: 16px;
  }
  label {
    display: block;
    font-size: 14px;
    font-weight: 500;
    color: var(--text-secondary);
    margin-bottom: 6px;
  }
  input[type="email"],
  input[type="password"] {
    width: 100%;
    padding: 8px 12px;
    border: 1px solid var(--border-default);
    border-radius: 6px;
    font-size: 14px;
    font-family: inherit;
    color: var(--text-primary);
    background: var(--surface-base);
  }
  input:focus {
    outline: none;
    border-color: var(--border-strong);
    box-shadow: 0 0 0 2px var(--action-primary);
  }
  .helper-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin: 16px 0 24px;
    font-size: 14px;
  }
  .helper-row label {
    margin: 0;
    display: flex;
    align-items: center;
    gap: 6px;
    color: var(--text-secondary);
    font-weight: 400;
  }
  .helper-row a {
    color: var(--action-primary);
    text-decoration: none;
  }
  button.primary {
    width: 100%;
    padding: 10px 16px;
    background: var(--action-primary);
    color: white;
    border: none;
    border-radius: 6px;
    font-size: 14px;
    font-weight: 500;
    font-family: inherit;
    cursor: pointer;
  }
  button.primary:hover { background: var(--action-primary-hover); }
  .secondary-link {
    text-align: center;
    margin-top: 16px;
    font-size: 14px;
    color: var(--text-secondary);
  }
  .secondary-link a {
    color: var(--action-primary);
    text-decoration: none;
    font-weight: 500;
  }
</style>
</head>
<body>
  <div class="login-card">
    <div class="brand">
      <div class="brand-mark">H</div>
      <div class="brand-name">HelpDesk Lite</div>
    </div>
    <h1>Sign in to your account</h1>
    <form>
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="you@company.com" autocomplete="email">
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="••••••••" autocomplete="current-password">
      </div>
      <div class="helper-row">
        <label><input type="checkbox"> Remember me</label>
        <a href="#">Forgot password?</a>
      </div>
      <button type="submit" class="primary">Sign in</button>
    </form>
    <div class="secondary-link">
      Don't have an account? <a href="#">Register</a>
    </div>
  </div>
</body>
</html>
